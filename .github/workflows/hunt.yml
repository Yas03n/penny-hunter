name: hunt

# Sweeps every 10 minutes so a new penny SKU reaches the phone as fast as
# GitHub will allow. Note: Actions cron is best-effort — runs are queued and
# can be several minutes late under load, so treat 10 minutes as the target,
# not a guarantee.
#
# Most sweeps find nothing and write nothing. Twice a day (4 AM / 1 PM Pacific)
# the run is promoted to a "digest": it rebuilds and notifies even when quiet,
# which is both the daily check-in and proof the job is alive.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      digest:
        description: "Notify even if nothing changed"
        type: boolean
        default: true

permissions:
  contents: write

# Never let two sweeps write the repo at once. Queue instead of cancelling, so
# a run that is mid-push is always allowed to finish.
concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this is the twice-daily digest
        id: mode
        run: |
          # Pacific hour, so the 4 AM / 1 PM check-ins hold through DST without
          # touching the cron. Minute < 10 keeps it to the first sweep of the hour.
          HOUR=$(TZ=America/Los_Angeles date +%-H)
          MIN=$(TZ=America/Los_Angeles date +%-M)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "digest=${{ inputs.digest }}" >> "$GITHUB_OUTPUT"
          elif { [ "$HOUR" = "4" ] || [ "$HOUR" = "13" ]; } && [ "$MIN" -lt 10 ]; then
            echo "Digest sweep (${HOUR}:${MIN} PT)."
            echo "digest=true" >> "$GITHUB_OUTPUT"
          else
            echo "Routine sweep (${HOUR}:${MIN} PT)."
            echo "digest=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sweep the penny lists
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python hunt.py ${{ steps.mode.outputs.digest == 'true' && '--digest' || '' }}

      - name: Commit if the lists moved
        run: |
          git config user.name  "penny-hunter[bot]"
          git config user.email "penny-hunter[bot]@users.noreply.github.com"
          git add data/finds.json docs/index.html
          if git diff --staged --quiet; then
            echo "Nothing changed — no commit."
            exit 0
          fi
          git commit -m "chore: penny sweep $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"
          # Rebase onto anything that landed while this sweep was running.
          git pull --rebase --autostash origin main
          git push
